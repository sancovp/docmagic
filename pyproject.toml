[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docmagic"
version = "0.1.0"
description = "Repo-level causality scanner for AI-coded systems. Finds hidden edges, stale surfaces, and invisible coupling that make AI agents drift."
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Isaac", email = "isaac@sancovp.com"}
]
keywords = ["ai", "coding", "documentation", "causality", "mcp", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "networkx>=3.0",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.28.1"]

[project.scripts]
docmagic = "docmagic.cli:main"
